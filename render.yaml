services:
  - type: web
    name: eleven-private-telegram-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ELEVENLABS_FIREBASE_API_KEY
        sync: false
      - key: MAX_BATCH_ACCOUNTS
        value: "100"
